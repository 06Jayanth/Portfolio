<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Inter:wght@400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;display=swap');
      .title-cinzel { font-family: 'Cinzel', 'Georgia', 'Times New Roman', serif; }
      .name-playfair { font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif; }
      .text-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="#FCFCFA"/>
  
  <!-- Outer Blue Border -->
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Inner Gold Border -->
  <rect x="52" y="52" width="1096" height="746" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <rect x="58" y="58" width="1084" height="734" fill="none" stroke="#E5C158" stroke-width="1" opacity="0.6"/>

  <!-- Corner Ornaments (Gold) -->
  <path d="M52,72 L72,52 M52,80 L80,52 M1148,72 L1128,52 M1148,80 L1120,52 M52,778 L72,798 M52,770 L80,798 M1148,778 L1128,798 M1148,770 L1120,798" stroke="#D4AF37" stroke-width="1.5" fill="none"/>

  <!-- Header Logo UPTOSKILLS -->
  <g transform="translate(480, 95)">
    <circle cx="10" cy="18" r="7" fill="#10B981" />
    <path d="M4 28 C4 23, 16 23, 16 28" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="32" y="27" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#1E3A8A" letter-spacing="1">UPTO<tspan fill="#10B981">SKILLS</tspan></text>
    <text x="32" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#4B5563" letter-spacing="1.5">LET'S MAKE FRESHERS EMPLOYABLE!</text>
  </g>

  <!-- Certificate Heading -->
  <text x="600" y="215" text-anchor="middle" class="title-cinzel" font-size="44" font-weight="700" fill="#1E3A8A" letter-spacing="8">CERTIFICATE</text>
  <text x="600" y="255" text-anchor="middle" class="text-inter" font-size="18" font-weight="700" fill="#1F2937" letter-spacing="4">OF INTERNSHIP COMPLETION</text>
  
  <text x="600" y="305" text-anchor="middle" class="name-playfair" font-style="italic" font-size="20" fill="#4B5563">This is to certify that</text>

  <!-- Candidate Name -->
  <text x="600" y="375" text-anchor="middle" class="name-playfair" font-size="44" font-weight="700" fill="#111827" letter-spacing="1">Jayanth Vishwakarma G</text>
  
  <!-- Internship Role & Domain -->
  <text x="600" y="425" text-anchor="middle" class="text-inter" font-size="19" font-weight="500" fill="#374151">has successfully completed their internship as Captain of domain</text>
  <text x="600" y="468" text-anchor="middle" class="text-inter" font-size="25" font-weight="800" fill="#1E3A8A" letter-spacing="2">FIGMA / UI / UX</text>
  <text x="600" y="505" text-anchor="middle" class="text-inter" font-size="18" font-weight="700" fill="#1F2937">from 16 May 2026 to 16 August 2026</text>

  <!-- Commendation Text -->
  <text x="600" y="555" text-anchor="middle" class="text-inter" font-size="14.5" font-weight="400" fill="#4B5563">During this period, the candidate demonstrated exemplary professional standards, technical</text>
  <text x="600" y="580" text-anchor="middle" class="text-inter" font-size="14.5" font-weight="400" fill="#4B5563">proficiency, and significant contribution to our organizational goals.</text>

  <!-- Bottom Left: Metadata -->
  <g transform="translate(105, 630)">
    <!-- Yellow Accent Line -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="#EAB308" stroke-width="4"/>
    <text x="12" y="14" class="text-inter" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1">CERTIFICATE ID</text>
    <text x="12" y="33" class="text-inter" font-size="14" font-weight="800" fill="#1E3A8A" letter-spacing="0.5">US-INT-2026-K4IKUF9</text>

    <!-- Blue Accent Line -->
    <line x1="0" y1="52" x2="0" y2="92" stroke="#3B82F6" stroke-width="4"/>
    <text x="12" y="66" class="text-inter" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1">ISSUED ON</text>
    <text x="12" y="85" class="text-inter" font-size="13.5" font-weight="700" fill="#1F2937">20 / 08 / 2026</text>

    <text x="0" y="125" class="text-inter" font-size="11.5" font-weight="500" fill="#6B7280">Verify by mailing us at <tspan fill="#1E3A8A" font-weight="600">verify@uptoskills.in</tspan></text>
  </g>

  <!-- Bottom Right: Stamp & Signature -->
  <g transform="translate(900, 640)">
    <!-- Official Stamp Circle -->
    <g transform="translate(-10, -50)">
      <circle cx="45" cy="45" r="42" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="3,2" opacity="0.8"/>
      <circle cx="45" cy="45" r="36" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.8"/>
      <path id="stamp-arc" d="M15,45 A30,30 0 1,1 75,45" fill="none"/>
      <text font-size="8" font-family="'Inter', sans-serif" font-weight="700" fill="#1E3A8A" letter-spacing="1.5">
        <textPath href="#stamp-arc" startOffset="50%" text-anchor="middle">★ UPTOSKILLS ★</textPath>
      </text>
      <!-- Simulated Stamp Signature -->
      <path d="M28,48 Q40,30 50,50 T65,40" stroke="#1E3A8A" stroke-width="2" fill="none" opacity="0.85"/>
      <text x="45" y="68" text-anchor="middle" font-size="7.5" font-family="'Inter', sans-serif" font-weight="700" fill="#1E3A8A" letter-spacing="1">NEW DELHI</text>
    </g>

    <!-- Signature Line -->
    <line x1="-100" y1="75" x2="160" y2="75" stroke="#1F2937" stroke-width="1.5"/>
    <text x="30" y="96" text-anchor="middle" class="text-inter" font-size="12" font-weight="800" fill="#111827" letter-spacing="1.5">AUTHORIZED SIGNATORY</text>
    <text x="30" y="114" text-anchor="middle" class="text-inter" font-size="13" font-weight="600" fill="#4B5563">Shivam Agarwal</text>
  </g>
</svg>
